# 自带 MySQL 的完全独立部署：docker compose -f docker-compose.mysql.yml up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: worklog-reporter:1.0.0
    container_name: worklog-reporter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: mysql+pymysql://root:ztt123456@mysql:3306/daylife?charset=utf8mb4
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  mysql:
    image: mysql:8.4
    container_name: worklog-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ztt123456
      MYSQL_DATABASE: daylife
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pztt123456"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: